static def execThing (String cmd) {
	return cmd.execute().text.trim()
}

static def getCurrentGitHash() {
	return execThing('git rev-parse --short=8 HEAD')
}

static def generateVersionName() {
	// Dumb Keys: derive the displayed version from the latest release TAG name
	// (e.g. "v1.0" -> "1.0", "v1.0-beta1" -> "1.0-beta1"), instead of the old
	// count-of-tags scheme (which showed ~v74 from the upstream lineage). This
	// starts the Dumb Keys stable line cleanly at 1.0. versionCode is still the
	// commit count (see getVersionCode below), so update comparisons are unaffected.
	String lastVersionTag = execThing('git describe --match v[0-9]* --tags --abbrev=0')
	if (lastVersionTag == "") {
		return "0.0"
	}

	// strip the leading "v": "v1.0" -> "1.0", "v1.0-beta1" -> "1.0-beta1"
	String base = lastVersionTag.replaceFirst(/^v/, '')

	// commits since that tag (0 when building exactly on the tag)
	String gitLogResult = execThing("git log $lastVersionTag..HEAD --oneline")
	int commitsSinceLastTag = gitLogResult == '' ? 0 : gitLogResult.split('\n').size()

	// on the tag -> just the tag name; a few commits past it -> append the count
	// so in-between dev builds stay distinguishable
	return commitsSinceLastTag == 0 ? base : "$base+$commitsSinceLastTag"
}

ext.exec = { command ->
	return execThing(command)
}

ext.getVersionName = { ->
	return generateVersionName()
}

ext.getVersionCode = { ->
	String commitsCount = execThing("git rev-list --count HEAD")
	return Integer.valueOf(commitsCount)
}

ext.getDebugVersion = { ->
	return "debug (build: ${getVersionCode()}, git: ${getCurrentGitHash()})"
}

ext.getReleaseVersion = { ->
	return "${generateVersionName()} (build: ${getVersionCode()}, git: ${getCurrentGitHash()})"
}

ext.updateManifestVersion = { versionCode, versionName ->
	def manifestFile = file("src/main/AndroidManifest.xml")

	def newManifest = manifestFile
		.getText()
		.replaceFirst(~"versionCode=\"([^\"]+)\"", "versionCode=\"" + versionCode + "\"")
		.replaceFirst(~"versionName=\"([^\"]+)\"", "versionName=\"" + versionName + "\"")

	manifestFile.write(newManifest)
}
