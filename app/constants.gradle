ext.APP_NAME = 'tt9'
// KT9/Dumb TT9 fork: the Java package + R-class namespace stays io.github.sspanak.tt9 (so no source
// files move), but the INSTALLED app id is our own, so it installs cleanly alongside/over real TT9.
ext.PACKAGE_NAME = "io.github.sspanak.${APP_NAME}"
ext.APPLICATION_ID = "com.offlineinc.dumbtt9"

ext.LANGUAGES_DIR_NAME = 'languages'
ext.DEFINITIONS_DIR_NAME = 'definitions'
ext.DICTIONARIES_DIR_NAME = 'dictionaries'
ext.DICTIONARIES_DOWNLOAD_DIR_NAME = 'downloads'
ext.DICTIONARY_SIZES_DIR_NAME = 'dictionary-sizes'
ext.NGRAMS_DIR_NAME = 'ngrams'

def APP_ROOT_DIR = "${project.rootDir}/app"
ext.ICONS_DIR = "${APP_ROOT_DIR}/src/main/res/drawable"
ext.ICONS_JAVA_FILE = "${APP_ROOT_DIR}/src/main/java/${PACKAGE_NAME.replaceAll("\\.", "/")}/ui/StatusIcon.java"
def MAIN_ASSETS_DIR = "${APP_ROOT_DIR}/src/main/assets"
def FULL_VERSION_ASSETS_DIR = "${APP_ROOT_DIR}/src/full/assets"

ext.FUNDING_FILE = "${project.rootDir}/.github/FUNDING.yml"

ext.DOCS_DIR_NAME = "docs"
ext.HELP_MARKDOWN_DIR = "${project.rootDir}/${DOCS_DIR_NAME}/help"
ext.PRIVACY_POLICY_MARKDOWN = "${project.rootDir}/${DOCS_DIR_NAME}/privacy.md"
ext.DOCS_HTML_DIR = "${MAIN_ASSETS_DIR}/${DOCS_DIR_NAME}"

ext.LANGUAGES_INPUT_DIR = "${APP_ROOT_DIR}/${LANGUAGES_DIR_NAME}"
ext.DEFINITIONS_INPUT_DIR = "${LANGUAGES_INPUT_DIR}/${DEFINITIONS_DIR_NAME}"
ext.DICTIONARIES_INPUT_DIR = "${LANGUAGES_INPUT_DIR}/${DICTIONARIES_DIR_NAME}"
ext.NGRAMS_INPUT_DIR = "${LANGUAGES_INPUT_DIR}/${NGRAMS_DIR_NAME}"

ext.DICTIONARIES_DOWNLOAD_DIR = "${project.rootDir}/${DICTIONARIES_DOWNLOAD_DIR_NAME}"

ext.LANGUAGES_OUTPUT_DIR = "${MAIN_ASSETS_DIR}/${LANGUAGES_DIR_NAME}"
ext.DEFINITIONS_OUTPUT_FILE = "${LANGUAGES_OUTPUT_DIR}/${DEFINITIONS_DIR_NAME}.yml"
ext.DICTIONARY_META_OUTPUT_DIR = "${LANGUAGES_OUTPUT_DIR}/${DICTIONARIES_DIR_NAME}"
ext.DICTIONARIES_OUTPUT_DIR = "${FULL_VERSION_ASSETS_DIR}/${LANGUAGES_DIR_NAME}/${DICTIONARIES_DIR_NAME}"
ext.NGRAMS_META_OUTPUT_DIR = "${LANGUAGES_OUTPUT_DIR}/${NGRAMS_DIR_NAME}"
ext.NGRAMS_OUTPUT_DIR = "${FULL_VERSION_ASSETS_DIR}/${LANGUAGES_DIR_NAME}/${NGRAMS_DIR_NAME}"

// KT9/Dumb Keys fork: the lite flavor bundles NO dictionaries (that's the point — small APK, download
// languages on demand). To keep the keyboard usable offline out of the box we bundle ONLY English into
// the lite source set: the word list (~1.2 MB) plus its tiny ngrams for next-word prediction (~43 KB).
def LITE_VERSION_ASSETS_DIR = "${APP_ROOT_DIR}/src/lite/assets"
ext.LITE_DICTIONARIES_OUTPUT_DIR = "${LITE_VERSION_ASSETS_DIR}/${LANGUAGES_DIR_NAME}/${DICTIONARIES_DIR_NAME}"
ext.LITE_NGRAMS_OUTPUT_DIR = "${LITE_VERSION_ASSETS_DIR}/${LANGUAGES_DIR_NAME}/${NGRAMS_DIR_NAME}"

// KT9/Dumb Keys fork: downloadable dictionaries are pulled from UPSTREAM (sspanak/tt9), pinned to a
// fixed release tag rather than a per-file commit hash. The stock build stamps each dictionary with
// OUR local commit hash, which never exists on upstream (404). Pinning to a stable upstream tag that
// already contains all the dictionaries means downloads resolve with zero hosting on our side. Bump
// this when adopting newer upstream dictionaries.
ext.DICTIONARY_UPSTREAM_REVISION = "v63.0"

ext.LANGUAGE_VALIDATION_DIR = layout.buildDirectory.dir("langValidation")

ext.CSV_DELIMITER = '	' // TAB
ext.DICTIONARY_OUTPUT_EXTENSION = 'zip'
ext.MAX_WORD_FREQUENCY = 9999
ext.MAX_ERRORS = 50
